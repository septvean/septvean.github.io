[defaults]
inventory = /data/ansible/etc/hosts
forks = 10
interpreter_python = auto_silent
deprecation_warnings = False
host_key_checking = False
# executable = /bin/bash

[ssh_connection]
scp_if_ssh = True
ssh_args = -C -o ConnectTimeout=3 -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
